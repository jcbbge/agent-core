[component]
id = "hook/credential-guard"
kind = "hook"
what = "Local pre-commit secret gate — refuses commits whose staged added lines contain credential-like strings; canonical script installable into any repo via --install"
contract = [
  "staged additions carrying a live credential refuse the commit (exit 1, file named)",
  "placeholder values (REDACTED / EXAMPLE / XXXX / angle brackets / dollar-brace) never trigger",
  "a diff that only removes a secret passes",
  "CREDENTIAL_GUARD=off passes but prints a loud OVERRIDE warning to stderr",
  "internal errors fail open with a warning, never blocking a commit",
]

[[oracle]]
run = "test/credential-guard.sh blocks-live"
[[oracle]]
run = "test/credential-guard.sh passes-placeholders"
[[oracle]]
run = "test/credential-guard.sh removal-only"
[[oracle]]
run = "test/credential-guard.sh override-warns"
[[oracle]]
run = "test/credential-guard.sh fail-open"

[suite]
run = "test/credential-guard.sh blocks-live && test/credential-guard.sh passes-placeholders && test/credential-guard.sh removal-only && test/credential-guard.sh override-warns && test/credential-guard.sh fail-open"
